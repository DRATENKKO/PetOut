name: pet_out
description: "🐕 PetOut - Premium pet activity timers for apartment dogs. Track walks, baths, and meals with beautiful timers, achievements, maps, adventure mode and photo gallery."
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Storage & Persistence
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Media & Notifications
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0

  # Charts & Analytics
  fl_chart: ^0.69.2

  # Social & Sharing
  share_plus: ^10.1.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.0

  # Celebrations
  confetti: ^0.8.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
